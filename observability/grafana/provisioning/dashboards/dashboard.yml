# Grafana Dashboard Provisioning
#
# Auto-loads dashboards from the dashboards folder.

apiVersion: 1

providers:
  - name: 'Agent Playground'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
