# Promtail Configuration for Docker Log Collection

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    
    pipeline_stages:
      # Parse Docker JSON logs
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            container_id: container_id
            container_name: container_name
      
      # Extract container name from log file path
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.*'
      
      # Add container labels
      - labels:
          container_id:
          stream:
      
      # Parse agent-specific logs
      - match:
          selector: '{container_name=~"fools.*agent.*"}'
          stages:
            - regex:
                expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\s+(?P<level>\w+)\s+(?P<logger>[\w\.]+)\s+(?P<message>.*)'
            - labels:
                level:
                logger:
            - timestamp:
                source: timestamp
                format: '2006-01-02 15:04:05,000'
      
      # Parse LiveKit logs
      - match:
          selector: '{container_name=~"fools.*livekit.*"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  time: time
                  room: room
                  participant: participant
            - labels:
                level:
                room:
                participant:
      
      # Parse Ollama logs
      - match:
          selector: '{container_name=~"fools.*ollama.*"}'
          stages:
            - regex:
                expression: '(?P<level>\w+)\s+(?P<message>.*)'
            - labels:
                level:
      
      # Output log line
      - output:
          source: output