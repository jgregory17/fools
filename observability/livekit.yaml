# LiveKit Server Configuration for Local Development
#
# This is a minimal config for local development/testing.
# For production, see: https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: false

# Development keys (DO NOT use in production)
keys:
  devkey: secret

# Logging
logging:
  level: info
  json: false

# Room settings
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 10

# Turn server (for NAT traversal in dev)
turn:
  enabled: true
  udp_port: 7882
  tls_port: 0

# Webhooks (optional - for production monitoring)
# webhook:
#   urls:
#     - http://agent:8080/api/v1/webhook
