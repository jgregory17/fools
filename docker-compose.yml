# Agent Playground - Full Local Stack
#
# Starts: LiveKit server, Agent service, Ollama LLM, Frontend UI, Prometheus, Grafana
#
# Usage:
#   docker compose up --build               # Start all services
#   docker compose up --build --scale agent=3  # Scale agents
#   docker compose down -v                  # Stop and remove volumes
#
# URLs:
#   Frontend:   http://localhost:3001       # Web UI for voice agent
#   LiveKit:    http://localhost:7880
#   Agent:      http://localhost:8080/healthz, /metrics, /api/token
#   Ollama:     http://localhost:11434
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin/admin)

version: "3.9"

services:
  # ============================================================================
  # LiveKit Server
  # ============================================================================
  livekit:
    image: livekit/livekit-server:latest
    command:
      - --config=/etc/livekit.yaml
      - --dev
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # RTC/WebRTC
      - "7882:7882"   # TURN/UDP
    volumes:
      - ./observability/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agent-net

  # ============================================================================
  # Agent Service (Voice AI Worker)
  # ============================================================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - AGENT_MODE=${AGENT_MODE:-selfhosted}
    environment:
      # Agent mode: selfhosted = fully local (Vosk STT, Ollama LLM, Piper TTS)
      - AGENT_MODE=${AGENT_MODE:-selfhosted}
      # Agent identification (hostname is unique per container)
      - AGENT_ID=${AGENT_ID:-}
      # LLM configuration (Ollama with OpenAI-compatible API)
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      # LiveKit connection
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      # Selfhosted model config
      - VOSK_MODEL=${VOSK_MODEL:-vosk-model-small-en-us-0.15}
      - PIPER_VOICE=${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      # Persist model downloads across restarts
      - vosk-models:/home/agent/.cache/vosk
      - piper-models:/home/agent/.local/share/piper
    depends_on:
      livekit:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Worker doesn't expose HTTP, just check process is alive
    healthcheck:
      test: ["CMD", "pgrep", "-f", "agent_playground.worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Models may take time to download
    networks:
      - agent-net
    deploy:
      resources:
        limits:
          memory: 4G  # Increased for local models

  # ============================================================================
  # Frontend Web UI
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-accessible URLs (external)
        - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
        - NEXT_PUBLIC_ENABLE_VIDEO=false
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - agent
      - livekit
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agent-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Ollama LLM Service
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agent-net
    # GPU support: see docker-compose.gpu.yml for NVIDIA GPU configuration
    # For CPU-only, this works as-is

  # ============================================================================
  # Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-net

  # ============================================================================
  # Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-net

# ============================================================================
# Networks
# ============================================================================
networks:
  agent-net:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  ollama-models:
    name: agent-playground-ollama-models
  prometheus-data:
    name: agent-playground-prometheus-data
  grafana-data:
    name: agent-playground-grafana-data
