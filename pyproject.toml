[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-playground"
version = "0.1.0"
description = "A modular, production-quality voice agent framework on LiveKit with local inference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "Agent Playground Authors"}
]
keywords = [
    "voice-ai",
    "livekit",
    "agents",
    "asr",
    "tts",
    "llm",
    "streaming",
    "realtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",  # Environment variable loading
    "aiohttp>=3.9",  # HTTP server for /metrics, /healthz
    "aiohttp-cors>=0.7",  # CORS support for frontend
    "prometheus-client>=0.20",  # Prometheus metrics
    "httpx>=0.27",  # HTTP client for health checks
    "livekit-api>=0.7",  # LiveKit token generation
    "opentelemetry-api>=1.20",  # OpenTelemetry tracing API
    "opentelemetry-sdk>=1.20",  # OpenTelemetry SDK
    "opentelemetry-exporter-otlp>=1.20",  # OTLP exporter
    "opentelemetry-instrumentation>=0.40b0",  # Auto-instrumentation (beta version)
]

[project.optional-dependencies]
# Core LiveKit integration
livekit = [
    "livekit>=0.13",
    "livekit-agents[silero,turn-detector]>=1.0",
    "livekit-plugins-noise-cancellation>=0.2",  # BVC for improved STT accuracy
    "livekit-plugins-openai>=0.10",  # OpenAI TTS + Ollama LLM support
    "livekit-plugins-deepgram>=0.6",  # Deepgram STT
]

# Local ASR backends
asr = [
    "faster-whisper>=1.0",
    "vosk>=0.3",  # Vosk: true streaming STT (local, no API needed)
    # "pywhispercpp>=1.0",  # Alternative whisper.cpp binding
]

# Local LLM backends
llm = [
    "httpx>=0.27",  # For Ollama HTTP client
    # "vllm>=0.4",  # Optional: vLLM for high-throughput
]

# Local TTS backends
tts = [
    "piper-tts>=1.2",
    # "TTS>=0.22",  # Alternative: Coqui TTS
]

# All local inference
local = [
    "agent-playground[asr,llm,tts]",
]

# Fully self-hosted (no cloud APIs needed)
selfhosted = [
    "vosk>=0.3",       # Streaming STT (local)
    "piper-tts>=1.2",  # Neural TTS (local)
    "httpx>=0.27",     # For Ollama HTTP client
    "livekit>=0.13",
    "livekit-agents[silero,turn-detector]>=1.0",
    "livekit-plugins-openai>=0.10",  # For Ollama LLM via OpenAI-compatible API
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML",
]

# Full installation
all = [
    "agent-playground[livekit,local,dev]",
]

[project.scripts]
agent-playground = "agent_playground.cli:main"

[project.urls]
Homepage = "https://github.com/example/agent-playground"
Documentation = "https://github.com/example/agent-playground#readme"
Repository = "https://github.com/example/agent-playground"
Issues = "https://github.com/example/agent-playground/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_playground = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
